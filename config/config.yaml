api:
  base_url: "https://newsapi.org/v2"
  endpoints:
    news: "/top-headlines"
    data: "/everything"
  params:
    language: "en"
    pageSize: 100
  api_key: "23c3692d06d049aea56bcbd896938f4f"

categories:
  technology:
    name: "Technology"
    filters:
      - q: "technology OR AI OR artificial intelligence"
      - sortBy: "publishedAt"
  business:
    name: "Business"
    filters:
      - q: "business OR economy OR finance"
      - sortBy: "publishedAt"
  general:
    name: "General"
    filters:
      - q: "general OR world OR politics"
      - sortBy: "publishedAt"

dashboard:
  title: "News Analytics Dashboard"
  refresh_interval: 300  # 5 minutes in seconds
  default_chart_type: "line"
  layout:
    rows: 2
    cols: 2
    height: 400
    margin: 20 
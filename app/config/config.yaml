# API Configuration
api:
  base_url: "https://newsapi.org/v2"
  endpoints:
    news: "/top-headlines"
  params:
    language: "en"
    pageSize: 100
  api_key: "23c3692d06d049aea56bcbd896938f4f"

# Data Categories
categories:
  technology:
    name: "Technology News"
    filter:
      column: "category"
      value: "technology"
  business:
    name: "Business News"
    filter:
      column: "category"
      value: "business"
  general:
    name: "General News"
    filter:
      column: "category"
      value: "general"

# Dashboard Configuration
dashboard:
  title: "News Analytics Dashboard"
  refresh_interval: 300  # in seconds
  default_chart:
    type: "bar"
    x_column: "publishedAt"
    y_column: "count"
  available_charts:
    - line
    - bar
    - scatter
    - area
  layout:
    charts_per_row: 2
    chart_height: 400
    chart_width: 600